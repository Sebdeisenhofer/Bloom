server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve "rasa" lazily so nginx still starts if the Rasa container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Basic hardening: no framing, no MIME sniffing, scripts only from this site, mic only for this site.
    server_tokens off;
    # On the public server Caddy sits in front; take the visitor's address from it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 64k;

    location /webhooks/ {
        set $rasa_upstream rasa:5005;
        proxy_pass http://$rasa_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location /api/ {
        set $events_upstream events-api:5056;
        proxy_pass http://$events_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
