flows:
  pattern_session_start:
    description: Welcome a new visitor or recognize a returning visitor.
    name: pattern session start
    steps:
      - action: action_load_profile
        next:
          - if: slots.profile_exists
            then: END
          - else: onboarding_link
      - id: onboarding_link
        link: onboarding_survey

  onboarding_survey:
    description: Learn a visitor's activity preferences the first time they visit.
    steps:
      - id: ask_hobbies
        collect: hobbies
        description: Hobbies or things the visitor enjoys doing for fun.
      - id: ask_partner_activities
        collect: partner_activities
        description: Whether they want activities to do with a partner or spouse.
      - id: ask_interests
        collect: interests
        description: Types of community events that interest the visitor.
      - id: ask_preferred_times
        collect: preferred_times
        description: Preferred time of day for activities.
      - id: ask_preferred_group_size
        collect: preferred_group_size
        description: Whether the visitor prefers small or large groups.
      - id: ask_travel_distance
        collect: travel_distance
        description: How far the visitor is willing to travel.
      - action: action_save_profile
      - action: utter_welcome_back

  create_event:
    description: Help a community member post an event, confirm it, then save it.
    steps:
      - id: ask_title
        collect: event_title
        description: The event name or title.
      - id: ask_date
        collect: event_date
        description: The event date or day.
      - id: ask_time
        collect: event_time
        description: The start time of the event.
      - id: ask_location
        collect: event_location
        description: The address, venue, or meeting place.
      - id: ask_host
        collect: event_host
        description: The host's name.
      - id: ask_description
        collect: event_description
        description: An optional short description of the event. If the user says skip, no, or none, set it to "skip".
        ask_before_filling: true
      - id: review
        action: action_review_event
      - id: ask_confirmation
        collect: event_confirmation
        description: The user's yes or no answer to posting the event. Set "yes" for yes, yeah, sure, yep; "no" for no, nope.
        ask_before_filling: true
        next:
          - if: slots.event_confirmation = "yes"
            then: save_event
          - else: not_posted
      - id: not_posted
        action: utter_event_not_posted
        next: clear_event
      - id: save_event
        action: action_save_event
      - id: clear_event
        set_slots:
          - event_title: null
          - event_date: null
          - event_time: null
          - event_location: null
          - event_host: null
          - event_description: null
          - event_confirmation: null

  search_events:
    description: Find local events and rank every event against the visitor's interests. Handles kinds of events, days, times, volunteer opportunities, and places such as a town, "the coast", "Portland", or a ZIP code with a distance ("within 10 miles of 97301").
    steps:
      - action: action_search_events

  update_interests:
    description: Add a new interest from free text and immediately search events with it.
    steps:
      - collect: interest_text
        description: A new interest or activity the visitor wants to find.
      - action: action_update_interests

  get_event_details:
    description: Tell the visitor about one specific event they name or pick ("tell me more about event 12", "tell me about the garden tour"), and offer to save it.
    steps:
      - action: action_get_event_details

  rsvp_event:
    description: Save an event to the visitor's My Events list, when they say yes to going or ask to save, RSVP, or attend a named event ("save the Gaiety Hollow Garden Tour", "yes, I'd like to go").
    steps:
      - action: action_save_rsvp

  set_reminder:
    description: Set a reminder for a saved event, for example "remind me a day before", "remind me 2 hours before", "set a reminder", "recuérdame".
    nlu_trigger:
      - intent: remind
    steps:
      - action: action_set_reminder

  set_language:
    description: Switch the conversation language when the visitor asks to talk in Spanish or English ("habla español", "in English please").
    nlu_trigger:
      - intent: set_language
    steps:
      - action: action_set_language

  help:
    description: Explain what the assistant can do.
    steps:
      - action: utter_help

  go_back:
    description: Go back to the previous question in the current task so the visitor can change their last answer. Use for "go back", "previous question", "back", "undo", "wait, change my last answer". Not for cancelling.
    nlu_trigger:
      - intent: go_back
    steps:
      - action: action_go_back

  repeat_last_message:
    description: Repeat the last assistant message when asked.
    steps:
      - action: action_repeat_last_message

  pattern_chitchat:
    description: Handle short greetings and ordinary conversation.
    name: pattern chitchat
    steps:
      - action: action_handle_free_text

  pattern_internal_error:
    description: When the LLM is unavailable (for example the shared endpoint is busy), still answer searches, event details, saves and help from keywords.
    name: pattern internal error
    steps:
      - action: action_llm_fallback

  pattern_cannot_handle:
    description: Respond warmly when a request is unclear.
    name: pattern cannot handle
    steps:
      - action: utter_fallback

  pattern_search:
    description: Find events when the visitor asks a question about local activities.
    name: pattern search
    steps:
      - action: action_search_events

  pattern_clarification:
    description: Answer a clarification request in plain language.
    name: pattern clarification
    steps:
      - action: utter_help

  pattern_skip_question:
    description: The visitor asks to skip the current question. Only the event description is optional.
    name: pattern skip question
    steps:
      - action: action_skip_question

  pattern_cancel_flow:
    description: The visitor asked to stop the current task. Rasa's built-in action removes it; then the task's answers are cleared.
    name: pattern cancel flow
    steps:
      - action: action_cancel_flow
      - action: action_clear_task_slots
      - action: utter_flow_cancelled_rasa

  pattern_continue_interrupted:
    description: Resume the interrupted task right away (the assistant already said what is happening).
    name: pattern continue interrupted
    steps:
      - noop: true
        next: END

  pattern_completed:
    description: Finish a completed task without an extra prompt.
    name: pattern completed
    steps:
      - noop: true
        next: END
