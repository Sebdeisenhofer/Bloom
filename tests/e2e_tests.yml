test_cases:
  - test_case: New visitor completes onboarding and sees clear next steps
    steps:
      - user: Hello
        assertions:
          - bot_uttered:
              utter_name: utter_ask_hobbies
      - user: I like reading and gardening
        assertions:
          - bot_uttered:
              utter_name: utter_ask_partner_activities
      - user: Yes, with my spouse
        assertions:
          - bot_uttered:
              utter_name: utter_ask_interests
      - user: Book clubs, gardens, and music
        assertions:
          - bot_uttered:
              utter_name: utter_ask_preferred_times
      - user: Mornings
        assertions:
          - bot_uttered:
              utter_name: utter_ask_preferred_group_size
      - user: Small groups
        assertions:
          - bot_uttered:
              utter_name: utter_ask_travel_distance
      - user: About ten miles
        assertions:
          - action_executed: action_save_profile
          - bot_uttered:
              utter_name: utter_welcome_back
          - bot_uttered:
              text_matches: "Find events this week.*Search by type.*Post your own event"

  - test_case: Search events and view details
    steps:
      - user: Find Saturday morning events near Riverfront Park
        assertions:
          - action_executed: action_search_events
          - bot_uttered:
              text_matches: "^I found \\d+ local events"

  - test_case: Add a new interest and search
    steps:
      - user: I've gotten into birdwatching
        assertions:
          - bot_uttered:
              text_matches: "added that to your interests"

  - test_case: Help and repeat
    steps:
      - user: What can you do?
        assertions:
          - bot_uttered:
              utter_name: utter_help
      - user: Repeat that
        assertions:
          - bot_uttered:
              text_matches: "I can suggest Salem-area events"

  - test_case: Cancel event creation
    steps:
      - user: I want to host an event
        assertions:
          - bot_uttered:
              utter_name: utter_ask_event_title
      - user: Cancel, go back
        assertions:
          - flow_cancelled:
              flow_id: create_event

  - test_case: "Fix 2 - confirm with 'Yes' posts the event"
    steps:
      - user: I want to post an event
        assertions:
          - flow_started: create_event
          - bot_uttered:
              utter_name: utter_ask_event_title
      - user: E2E Test Maple Tea
        assertions:
          - bot_uttered:
              utter_name: utter_ask_event_date
      - user: December 12
        assertions:
          - bot_uttered:
              utter_name: utter_ask_event_time
      - user: 2 PM
        assertions:
          - slot_was_set:
              - name: event_time
                value: "2:00 PM"
          - bot_uttered:
              utter_name: utter_ask_event_location
      - user: Salem Public Library
        assertions:
          - bot_uttered:
              utter_name: utter_ask_event_host
      - user: Jordan
        assertions:
          - bot_uttered:
              utter_name: utter_ask_event_description
      - user: "Bring a puzzle and meet a new neighbor."
        assertions:
          - action_executed: action_review_event
          - bot_uttered:
              utter_name: utter_ask_event_confirmation
      - user: "Yes"
        assertions:
          - slot_was_set:
              - name: event_confirmation
                value: "yes"
          - action_executed: action_save_event
          - bot_uttered:
              text_matches: "Your event, E2E Test Maple Tea, is posted"

