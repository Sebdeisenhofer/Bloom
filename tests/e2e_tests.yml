      - user: go back to the previous question
        assertions:
          - action_executed: action_go_back
          - bot_uttered:
              text_matches: "go back to the previous question"
          - bot_uttered:
              utter_name: utter_ask_event_title
      - user: E2E Test Garden Tea
        assertions:
          - slot_was_set:
