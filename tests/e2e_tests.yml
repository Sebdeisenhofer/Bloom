  - test_case: "Spanish - search, start posting, go back, cancel"
    steps:
      - user: '/set_language{"lang":"es"}'
        assertions:
          - slot_was_set:
              - name: language
                value: es
      - user: Quiero buscar eventos de jardinería
        assertions:
          - action_executed: action_search_events
          - bot_uttered:
              text_matches: "^Encontré \\d+ eventos locales"
      - user: Quiero publicar un evento
        assertions:
          - flow_started: create_event
          - bot_uttered:
              text_matches: "Cómo le gustaría llamar a su evento"
      - user: volver atrás
        assertions:
          - bot_uttered:
              text_matches: "primera pregunta"
      - user: cancelar
        assertions:
          - flow_cancelled:
              flow_id: create_event
          - bot_uttered:
              text_matches: "Está bien, lo detuve"

