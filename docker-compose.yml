services:
  action-server:
    build:
      context: .
      dockerfile: actions/Dockerfile
    environment:
      COMMUNITY_DB_PATH: /data/community.sqlite3
    volumes:
      - community-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  events-api:
    # Lets neighbors share events from the website. Same image and database as the action server.
    build:
      context: .
      dockerfile: actions/Dockerfile
    entrypoint: ["python", "-m", "actions.events_api"]
    environment:
      COMMUNITY_DB_PATH: /data/community.sqlite3
    volumes:
      - community-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5056/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  rasa:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RASA_PRO_LICENSE: ${RASA_PRO_LICENSE:?Set RASA_PRO_LICENSE in .env}
    depends_on:
      action-server:
        condition: service_healthy
    volumes:
      - rasa-models:/app/models
    ports:
      - "5006:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/status', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 180s
  web:
    image: nginx:1.27-alpine
    # The web UI (survey + events) works without Rasa, so don't block on it.
    depends_on:
      - action-server
      - events-api
    ports:
      - "8081:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  community-data:
  rasa-models:
