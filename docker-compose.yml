services:
  action-server:
    build:
      context: .
      dockerfile: actions/Dockerfile
    environment:
      COMMUNITY_DB_PATH: /data/community.sqlite3
      TZ: America/Los_Angeles  # "today" means today in Salem
      # The chat can set reminders too; it only needs to know which channels are configured.
      SMTP_HOST: ${SMTP_HOST-mailhog}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    volumes:
      - community-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  events-api:
    # Lets neighbors share events from the website. Same image and database as the action server.
    build:
      context: .
      dockerfile: actions/Dockerfile
    entrypoint: ["python", "-m", "actions.events_api"]
    environment:
      COMMUNITY_DB_PATH: /data/community.sqlite3
      TZ: America/Los_Angeles  # "today" means today in Salem
      # Optional real-event sources (Salem Public Library is always on).
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      EXTRA_ICAL_FEEDS: ${EXTRA_ICAL_FEEDS:-}
      # Reminder email: defaults to the MailHog demo inbox (http://localhost:8025).
      # Set SMTP_HOST= (empty) in .env to turn email reminders off, or point it at a real server.
      SMTP_HOST: ${SMTP_HOST-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Bloom <reminders@bloom.local>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Text reminders: optional. Without these, Bloom shows "Text reminders not configured".
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    volumes:
      - community-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5056/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  rasa:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RASA_PRO_LICENSE: ${RASA_PRO_LICENSE:?Set RASA_PRO_LICENSE in .env}
      TZ: America/Los_Angeles
    depends_on:
      action-server:
        condition: service_healthy
    volumes:
      - rasa-models:/app/models
    ports:
      - "5006:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/status', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 180s
  web:
    image: nginx:1.27-alpine
    # The web UI (survey + events) works without Rasa, so don't block on it.
    depends_on:
      - action-server
      - events-api
    ports:
      - "8081:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    # Demo inbox for reminder emails: open http://localhost:8025 to read them. Nothing leaves your computer.
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

volumes:
  community-data:
  rasa-models:
